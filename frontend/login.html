<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 자막 오타 검수 보조 도구</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .login-wrap { max-width: 420px; margin: 8vh auto 0; padding: 0 20px; }
    .login-card h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .login-card p { color: var(--muted); font-size: 0.9rem; margin: 0 0 18px; }
    .login-card input[type="password"] {
      width: 100%; padding: 12px; border: 1px solid var(--line);
      border-radius: 9px; font-size: 1rem; margin-bottom: 14px;
    }
    .login-error { color: var(--danger); font-size: 0.88rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>자막 오타 검수 보조 도구</h1>
    <p class="subtitle">팀 공유 비밀번호를 입력하세요</p>
  </header>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="/login">
      <h2>로그인</h2>
      <p>담당자에게 받은 공유 비밀번호를 입력하면 30일간 유지됩니다.</p>
      <!--ERROR-->
      <input type="password" name="password" placeholder="비밀번호" autofocus required />
      <button type="submit" class="primary">입장</button>
    </form>
  </div>
</body>
</html>
