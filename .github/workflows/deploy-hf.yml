name: Deploy to Hugging Face Space

# 수동 실행 (Actions 탭 → Run workflow, 또는 API 트리거).
# 필요한 저장소 설정 (Settings → Secrets and variables → Actions):
#   Secrets:  HF_TOKEN      - Hugging Face Write 토큰 (hf_...)
#             APP_PASSWORD  - 팀 공유 접속 비밀번호
#   Variables(선택): HF_SPACE - 기본 Space 이름 (예: myaccount/subtitle-checker)
on:
  workflow_dispatch:
    inputs:
      space:
        description: "HF Space 이름 (계정/이름). 비우면 HF_SPACE 변수 사용"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.23"

      - name: Check configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SPACE: ${{ inputs.space || vars.HF_SPACE }}
        run: |
          missing=0
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions에서 추가하세요. (huggingface.co/settings/tokens 에서 Write 토큰 발급)"; missing=1; fi
          if [ -z "$APP_PASSWORD" ]; then echo "::error::APP_PASSWORD 시크릿이 없습니다. 팀 공유 비밀번호를 시크릿으로 추가하세요."; missing=1; fi
          if [ -z "$SPACE" ]; then echo "::error::Space 이름이 없습니다. 실행 입력(space) 또는 HF_SPACE 변수(예: myaccount/subtitle-checker)를 설정하세요."; missing=1; fi
          exit $missing

      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ inputs.space || vars.HF_SPACE }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          python scripts/deploy_hf.py --space "$SPACE" --password "$APP_PASSWORD"

      - name: Result
        env:
          SPACE: ${{ inputs.space || vars.HF_SPACE }}
        run: |
          echo "### 배포 요청 완료 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Space: https://huggingface.co/spaces/$SPACE" >> "$GITHUB_STEP_SUMMARY"
          echo "- 첫 빌드는 10~20분 걸립니다 (OCR 모델 베이킹). Space 페이지의 Logs 탭에서 진행 확인." >> "$GITHUB_STEP_SUMMARY"
